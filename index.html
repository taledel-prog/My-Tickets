<!DOCTYPE html>

                extend: {
                    fontFamily: {

    <style>

<body class="min-h-screen pb-28 text-slate-100 selection:bg-indigo-500 selection:text-white">

    <!-- Add Event Modal -->

    <!-- View Ticket Modal -->
    <div id="viewModal" class="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto">

    <!-- JavaScript Logic -->
    <script>
        let events = JSON.parse(localStorage.getItem('user_tickets_v4')) || [
            {
                id: '1',
                title: 'הרצאה: בינה מלאכותית ומיחשוב עתידי',
                category: 'הרצאה',
                date: '2026-06-15T20:00',
                location: 'מרכז הכנסים תל אביב',
                ticketNumber: 'LEC-904',
                notes: 'אולם א\', שורה 5',
                tickets: [
                    { holder: 'ישראל ישראלי', fileData: null, fileName: null, fileType: null }
                ]
            },
            {
                id: '2',
                title: 'אירוע פרטי: מסיבת יום הולדת 40',
                category: 'אירוע פרטי',
                date: '2026-06-25T19:30',
                location: 'אולם אירועים השרון',
                ticketNumber: 'PRIV-102',
                notes: 'קוד כניסה בשער: 4421',
                tickets: [
                    { holder: 'דני כהן', fileData: null, fileName: null, fileType: null },
                    { holder: 'מיכל כהן', fileData: null, fileName: null, fileType: null }
                ]
            }
        ];

        let currentFilter = 'all';
        let currentView = 'list';
        let calendarDate = new Date();

        function saveToLocalStorage() {
            try {
                localStorage.setItem('user_tickets_v4', JSON.stringify(events));
            } catch(e) {
                alert('הזיכרון המקומי מלא. מומלץ להעלות קבצים קטנים יותר.');
            }
        }

        function downloadAppFile() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my_tickets_app.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('קובץ האפליקציה ירד בהצלחה למכשיר שלך!');
        }

        function addTicketInputRow() {
            const container = document.getElementById('ticketsContainer');
            if(!container) return;
            const rowCount = container.children.length + 1;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'ticket-row bg-slate-950/70 p-3 rounded-2xl border border-slate-800 space-y-2 relative';
            rowDiv.innerHTML = `
                <div class="flex justify-between items-center text-[11px] text-slate-400 font-semibold">
                    <span>כרטיס ${rowCount}</span>
                    <button type="button" class="btn-remove-row text-rose-400 hover:text-rose-300 text-xs cursor-pointer"><i class="fa-solid fa-trash-can"></i> הסר</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" placeholder="שם מחזיק הכרטיס" class="ticket-holder bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                    <input type="file" accept="image/*,application/pdf" class="ticket-file bg-slate-900 border border-slate-700/80 rounded-xl px-2 py-1.5 text-xs text-slate-400 file:ml-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:bg-indigo-600 file:text-white file:font-semibold">
                </div>
            `;
            container.appendChild(rowDiv);
            
            rowDiv.querySelector('.btn-remove-row').addEventListener('click', () => {
                rowDiv.remove();
            });
        }

        async function downloadAllFilesZip() {
            if (typeof JSZip === 'undefined') {
                alert('ספרית הזיפ טרם נטענה, נסה שנית בעוד רגע.');
                return;
            }
            const zip = new JSZip();
            const folder = zip.folder("event_tickets_files");
            let count = 0;

            events.forEach(ev => {
                if (ev.tickets && ev.tickets.length > 0) {
                    ev.tickets.forEach((t, idx) => {
                        if (t.fileData) {
                            const safeTitle = ev.title.replace(/[\\/:*?"<>|]/g, '_');
                            const safeHolder = (t.holder || `כרטיס_${idx+1}`).replace(/[\\/:*?"<>|]/g, '_');
                            const safeDate = ev.date ? ev.date.replace(/[\\/:*?"<>|]/g, '_').replace('T', '_') : 'no_date';
                            const ext = t.fileType && t.fileType.includes('pdf') ? 'pdf' : (t.fileType && t.fileType.includes('png') ? 'png' : 'jpg');
                            const fileName = `${safeTitle} - ${safeHolder} - ${safeDate}.${ext}`;
                            const base64Data = t.fileData.split(',')[1];
                            if (base64Data) {
                                folder.file(fileName, base64Data, {base64: true});
                                count++;
                            }
                        }
                    });
                }
            });

            if (count === 0) {
                alert('אין קבצים מצורפים בכרטיסים כרגע.');
                return;
            }

            folder.file("events_data.json", JSON.stringify(events, null, 2));

            const content = await zip.generateAsync({type: "blob"});
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tickets_files_folder_${new Date().toISOString().slice(0,10)}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert(`נוצרה תיקיית כרטיסים (ZIP) עם ${count} קבצים!`);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function saveEvent(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            if(submitBtn) {
                submitBtn.innerText = 'שומר אירוע...';
                submitBtn.disabled = true;
            }

            const titleVal = document.getElementById('eventTitle').value;
            const dateVal = document.getElementById('eventDate').value;
            const ticketRows = document.querySelectorAll('.ticket-row');
            
            const ticketsList = [];

            for (let i = 0; i < ticketRows.length; i++) {
                const row = ticketRows[i];
                const holderVal = row.querySelector('.ticket-holder').value || `כרטיס ${i+1}`;
                const fileInput = row.querySelector('.ticket-file');
                const file = fileInput.files[0];

                let fileData = null;
                let fileType = null;
                let fileName = null;

                if (file) {
                    try {
                        fileData = await readFileAsBase64(file);
                        fileType = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
                        const ext = fileType.includes('pdf') ? 'pdf' : (fileType.includes('png') ? 'png' : 'jpg');
                        fileName = `${titleVal} - ${holderVal} - ${dateVal.replace('T', '_')}.${ext}`;
                    } catch(err) {
                        console.error('Error reading file', err);
                    }
                }

                ticketsList.push({
                    holder: holderVal,
                    fileData: fileData,
                    fileName: fileName,
                    fileType: fileType
                });
            }

            const newEvent = {
                id: Date.now().toString(),
                title: titleVal,
                category: document.getElementById('eventCategory').value,
                date: dateVal,
                location: document.getElementById('eventLocation').value,
                ticketNumber: document.getElementById('eventTicketNumber').value,
                notes: document.getElementById('eventNotes').value,
                tickets: ticketsList
            };

            events.push(newEvent);
            saveToLocalStorage();
            closeAddModal();
            renderApp();
        }

        function deleteEvent(id) {
            if(confirm('האם אתה בטוח שברצונך למחוק אירוע זה?')) {
                events = events.filter(ev => ev.id !== id);
                saveToLocalStorage();
                closeViewModal();
                renderApp();
            }
        }

        function renderApp() {
            if(currentView === 'list') {
                renderList();

                renderCalendar();

        function renderList() {

            if(!container) return;
            const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
            
            let filtered = events.filter(ev => {
                const matchCat = currentFilter === 'all' || ev.category === currentFilter;
                
                const matchHolder = ev.tickets && ev.tickets.some(t => t.holder && t.holder.toLowerCase().includes(searchQuery));
                const matchSearch = ev.title.toLowerCase().includes(searchQuery) || 
                                    (ev.location && ev.location.toLowerCase().includes(searchQuery)) ||
                                    (ev.ticketNumber && ev.ticketNumber.toLowerCase().includes(searchQuery)) ||
                                    matchHolder;
                return matchCat && matchSearch;
            });

            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center space-y-3">
                        <i class="fa-solid fa-ticket-simple text-4xl text-slate-500"></i>
                        <p class="text-sm text-slate-400">אין כרטיסים להצגה</p>

            }

            container.innerHTML = filtered.map(ev => {
                const eventDate = new Date(ev.date);
                const dateStr = eventDate.toLocaleDateString('he-IL', { day: 'numeric', month: 'short', year: 'numeric' });
                const timeStr = eventDate.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
                
                const diffTime = eventDate - new Date();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                let badgeText = '';
                let badgeClass = 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30';
                if(diffDays === 0) { badgeText = 'היום!'; badgeClass = 'bg-rose-500/25 text-rose-300 border-rose-500/40 animate-pulse'; }
                else if(diffDays === 1) { badgeText = 'מחר'; }
                else if(diffDays > 1) { badgeText = `עוד ${diffDays} ימים`; }
                else { badgeText = 'התקיים'; badgeClass = 'bg-slate-700/50 text-slate-400 border-slate-600'; }

                const ticketsCount = ev.tickets ? ev.tickets.length : 0;
                const holdersList = ev.tickets ? ev.tickets.map(t => t.holder).filter(Boolean).join(', ') : '';

                return `
                    <div data-id="${ev.id}" class="btn-view-ticket glass-card rounded-2xl p-4 transition hover:border-indigo-500/50 cursor-pointer shadow-lg space-y-2.5 relative overflow-hidden">
                        <div class="flex justify-between items-start">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${badgeClass}">${badgeText}</span>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/80 font-medium">${ev.category}</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-base text-slate-100 flex items-center justify-between gap-2">
                                <span class="truncate">${ev.title}</span>

                            </h3>
                            <div class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                                <span><i class="fa-regular fa-calendar ml-1 text-indigo-400"></i>${dateStr} בשעה ${timeStr}</span>
                            </div>
                            ${ev.location ? `<div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5"><span><i class="fa-solid fa-location-dot ml-1 text-violet-400"></i>${ev.location}</span></div>` : ''}
                            ${holdersList ? `<div class="text-xs text-indigo-200/80 mt-1 truncate"><i class="fa-solid fa-user-group ml-1 text-indigo-400"></i>מחזיקים: ${holdersList}</div>` : ''}
                        </div>
                        ${ev.ticketNumber ? `<div class="bg-slate-900/60 rounded-xl p-2 flex justify-between items-center text-xs border border-slate-800"><span class="text-slate-400">מספר הזמנה:</span><span class="font-mono font-bold text-indigo-300">${ev.ticketNumber}</span></div>` : ''}

            document.querySelectorAll('.btn-view-ticket').forEach(card => {

        function openFileInBrowser(base64Data, mimeType) {
            try {
                const byteCharacters = atob(base64Data.split(',')[1]);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: mimeType || 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch(e) {
                alert('חלון דפדפן חסם את פתיחת הקובץ. ניתן ללחוץ על כפתור ההורדה לקובץ.');
            }
        }

                    <div class="mt-3 space-y-3">

                        ${ev.tickets.map((t, idx) => {

                                    fileHtml = `
                                        <div class="space-y-1 mt-1">
                                            <a href="${t.fileData}" download="${downloadName}" class="text-[11px] text-indigo-400 hover:underline flex items-center gap-1 font-semibold">
                                                <i class="fa-solid fa-download"></i> הורד תמונה (${t.holder})
                                            </a>
                                            <img src="${t.fileData}" data-b64="${t.fileData}" data-type="${t.fileType}" class="btn-open-media w-full max-h-48 object-contain rounded-xl border border-slate-700 bg-slate-950 cursor-pointer hover:opacity-90 transition shadow-inner"/>
                                        </div>`;
                                } else {
                                    fileHtml = `
                                        <div class="space-y-2 mt-1.5 p-2.5 bg-slate-950/80 rounded-xl border border-slate-700/80">
                                            <div class="flex items-center justify-between">
                                                <div class="flex items-center gap-2">

                                                    <div>
                                                        <span class="text-xs font-bold text-slate-200 block">${t.holder}</span>

                                                    </div>
                                                </div>
                                                <div class="flex items-center gap-1">
                                                    <button type="button" data-b64="${t.fileData}" data-type="${t.fileType}" class="btn-open-media bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1 rounded-lg flex items-center gap-1 font-semibold shadow cursor-pointer">
                                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> הצג
                                                    </button>
                                                    <a href="${t.fileData}" download="${downloadName}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded-lg border border-slate-700">
                                                        <i class="fa-solid fa-download"></i>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>`;

                            } else {
                                fileHtml = `<span class="text-[11px] text-slate-500 block italic">לא צורף קובץ כרטיס</span>`;

                            return `
                                <div class="bg-slate-900/90 rounded-2xl p-3 border border-slate-800 space-y-1">

                        <div class="font-mono text-lg font-bold text-indigo-300 tracking-wider">${ev.ticketNumber}</div>
                        <div class="h-12 w-3/4 mx-auto barcode rounded-lg opacity-80"></div>
                    </div>
                ` : ''}

                ${ev.notes ? `<div class="bg-slate-900/50 rounded-xl p-3 text-xs text-slate-300 border border-slate-800"><span class="font-bold text-slate-400 block mb-1">הערות:</span>${ev.notes}</div>` : ''}

                        <i class="fa-brands fa-google"></i> הוסף ליומן Google
                    </a>

                        <i class="fa-solid fa-bell"></i> הורד תזכורת (ICS)
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnShareModal" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border border-slate-700 cursor-pointer">

                        <i class="fa-solid fa-trash"></i> מחוק אירוע
                    </button>

            document.querySelectorAll('.btn-open-media').forEach(btn => {
                btn.addEventListener('click', () => {

        function shareTicket(id) {
            const ev = events.find(e => e.id === id);
            if(!ev) return;
            const shareText = `🎟️ כרטיס לאירוע: ${ev.title} - ${ev.date}`;
            if (navigator.share) {
                navigator.share({ title: ev.title, text: shareText }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert('פרטי הכרטיס הועתקו ללוח!');
            }
        }

        function changeMonth(dir) {
            calendarDate.setMonth(calendarDate.getMonth() + dir);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
            const titleElem = document.getElementById('calendarMonthTitle');
            if(titleElem) titleElem.innerText = monthNames[month] + " " + year;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            if(!grid) return;
            grid.innerHTML = '';

            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for(let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasEvent = events.some(ev => ev.date.startsWith(dateStr));
                
                grid.innerHTML += `
                    <div data-date="${dateStr}" class="btn-cal-day aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer transition ${hasEvent ? 'bg-indigo-600/40 border border-indigo-500 font-bold text-indigo-200' : 'bg-slate-800/40 hover:bg-slate-800 text-slate-300'} text-xs">
                        <span>${day}</span>
                        ${hasEvent ? '<div class="w-1.5 h-1.5 bg-indigo-400 rounded-full mt-1 glow-effect"></div>' : ''}
                    </div>
                `;
            }

            document.querySelectorAll('.btn-cal-day').forEach(el => {
                el.addEventListener('click', () => {
                    selectCalendarDate(el.getAttribute('data-date'));
                });
            });
        }

        function selectCalendarDate(dateStr) {
            const container = document.getElementById('selectedDayEvents');
            if(!container) return;
            const dayEvents = events.filter(ev => ev.date.startsWith(dateStr));

            if(dayEvents.length === 0) {
                container.innerHTML = `<div class="glass-card rounded-2xl p-4 text-center text-xs text-slate-400">אין אירועים בתאריך ${dateStr}</div>`;
                return;
            }

            container.innerHTML = `<h4 class="text-xs font-bold text-indigo-300 mb-2">אירועים בתאריך ${dateStr}:</h4>` + dayEvents.map(ev => `
                <div data-id="${ev.id}" class="btn-view-ticket glass-card rounded-xl p-3 cursor-pointer hover:border-indigo-500/50 flex justify-between items-center">
                    <div>
                        <h5 class="font-bold text-sm text-white">${ev.title}</h5>
                        <p class="text-xs text-slate-400">${ev.location || ev.category}</p>
                    </div>
                    <span class="text-xs bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-semibold">צפה</span>
                </div>
            `).join('');

            document.querySelectorAll('.btn-view-ticket').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.getAttribute('data-id');
                    viewTicket(id);
                });
            });
        }

        // Initialize event listeners safely when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnDownloadApp')?.addEventListener('click', downloadAppFile);
            document.getElementById('btnDownloadZip')?.addEventListener('click', downloadAllFilesZip);
            document.getElementById('btnDriveBackup')?.addEventListener('click', saveToGoogleDrive);

            document.getElementById('btnOpenAddHeader')?.addEventListener('click', openAddModal);
            document.getElementById('btnOpenAddCenter')?.addEventListener('click', openAddModal);
            document.getElementById('btnCloseAddModal')?.addEventListener('click', closeAddModal);
            document.getElementById('btnCloseViewModal')?.addEventListener('click', closeViewModal);

            document.getElementById('btnAddTicketRow')?.addEventListener('click', addTicketInputRow);

            document.getElementById('btnListView')?.addEventListener('click', () => switchView('list'));
            document.getElementById('btnCalView')?.addEventListener('click', () => switchView('calendar'));
            document.getElementById('btnNavHome')?.addEventListener('click', () => { switchView('list'); setFilter('all'); });
            document.getElementById('btnNavCalendar')?.addEventListener('click', () => switchView('calendar'));

            document.getElementById('btnPrevMonth')?.addEventListener('click', () => changeMonth(-1));
            document.getElementById('btnNextMonth')?.addEventListener('click', () => changeMonth(1));

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-filter');
                    setFilter(cat);
                });
            });

            document.getElementById('eventForm')?.addEventListener('submit', saveEvent);

            renderApp();
        });
    </script>
</body>
</html>
